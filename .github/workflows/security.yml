name: SOL firewall
on:
  push:
    branches: [feat/devnet-transaction-firewall, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    # Playwright 1.55.1 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm lint && pnpm test
      - name: Run transaction security regression tests
        run: pnpm --filter @solguard/web exec vitest run tests/flow.test.ts tests/receipts.test.ts tests/http.test.ts tests/server.test.ts
      - name: Verify HTTPS smoke-check harness (synthetic responses only)
        run: node --test scripts/verify-https.test.mjs
      - name: Record dependency advisory details
        run: |
          pnpm audit --json > "$RUNNER_TEMP/solguard-audit.json" || true
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/solguard-audit.json","utf8")); if (!r.advisories || !r.metadata) throw Error("Audit report unavailable"); for(const a of Object.values(r.advisories)) console.log(JSON.stringify({module:a.module_name,severity:a.severity,url:a.url,vulnerable:a.vulnerable_versions,patched:a.patched_versions,paths:a.findings?.flatMap(f=>f.paths??[])}));'
      - run: pnpm audit --audit-level high
      - name: Install Chromium for mock-wallet regression
        run: pnpm --filter @solguard/web exec playwright install --with-deps chromium
      - name: Run mock-wallet browser regression
        run: pnpm --filter @solguard/web browser:sg01
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner'
  devnet:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node --test packages/security/tests/integration/devnet.mjs
